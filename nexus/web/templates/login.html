<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in to Nexus-OSINT</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center">
  <main class="w-full max-w-md p-6 space-y-4">
    <h1 class="text-lg font-semibold">&#128273; Sign in to Nexus-OSINT</h1>
    <form method="post" action="/login" class="space-y-3">
      <input type="hidden" name="next" value="{{ next }}" />
      <input type="password" name="password" autocomplete="current-password" autofocus required
             aria-label="App password"
             class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-sm" />
      <button class="rounded bg-amber-500 hover:bg-amber-400 text-slate-950 text-sm font-medium px-4 py-1.5"
              {% if wait %}disabled{% endif %}>Sign in</button>
      {% if error %}<p class="text-xs text-rose-400" role="alert">{{ error }}</p>{% endif %}
    </form>
    <p class="text-xs text-slate-500">
      Forgot it? Stop Nexus, delete the <span class="mono">APP_PASSWORD_HASH</span> line from
      <span class="mono">.env</span>, then start it again.
    </p>
  </main>
</body>
</html>
