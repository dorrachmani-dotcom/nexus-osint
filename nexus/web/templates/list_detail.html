{% extends "base.html" %}
{% block content %}
<section class="space-y-4">
  <div class="flex items-center gap-3">
    <a href="/lists" class="text-sm text-slate-500 hover:text-amber-400">&larr; Lists</a>
    <h1 class="text-lg font-semibold text-slate-100">{{ list.name }}</h1>
    <span class="text-xs mono text-slate-500">{{ count }} item{{ '' if count == 1 else 's' }}</span>
  </div>

  <div id="feed">
    {% include "_feed.html" %}
  </div>
</section>
{% endblock %}
