<div id="notes" class="space-y-2">
  {% if notes %}
    {% for n in notes %}
    <div class="rounded border border-slate-800 bg-slate-900/60 p-2.5">
      <p class="text-sm text-slate-200 whitespace-pre-wrap">{{ n.body | linkify }}</p>
      <div class="mt-1 flex items-center gap-3 text-[10px] mono text-slate-500">
        <span>{{ n.created_at[:16] }}</span>
        <span class="flex-1"></span>
        <details class="relative">
          <summary class="cursor-pointer hover:text-amber-400 list-none">edit</summary>
          <form hx-post="/notes/{{ n.id }}/update" hx-target="#notes" hx-swap="outerHTML"
                hx-on::after-request="this.closest('details').open=false"
                class="mt-1 space-y-1">
            <textarea name="body" rows="3" required
              class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200">{{ n.body }}</textarea>
            <button class="rounded bg-amber-500 hover:bg-amber-400 text-slate-950 px-2 py-0.5 font-medium">Save</button>
          </form>
        </details>
        <button hx-post="/notes/{{ n.id }}/delete" hx-target="#notes" hx-swap="outerHTML"
          hx-confirm="Delete this note?"
          class="hover:text-red-400">delete</button>
      </div>
    </div>
    {% endfor %}
  {% else %}
    <p class="text-sm text-slate-500">No notes yet.</p>
  {% endif %}
</div>
