{% extends "base.html" %}
{% block content %}
<section class="space-y-5">
  <div>
    <h1 class="text-lg font-semibold text-slate-100">Investigation cases</h1>
    <p class="text-sm text-slate-400">Group pinned items and notes into named investigations.</p>
  </div>

  <form hx-post="/cases" hx-target="#case-list" hx-swap="outerHTML"
        hx-on::after-request="this.reset()"
        class="bg-slate-900 border border-slate-800 rounded-lg p-4 space-y-3">
    <div class="grid gap-3 sm:grid-cols-[1fr_2fr_auto_auto] items-end">
      <label class="block">
        <span class="text-xs text-slate-400">Case name</span>
        <input name="name" required maxlength="120"
               class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-sm" />
      </label>
      <label class="block">
        <span class="text-xs text-slate-400">Description (optional)</span>
        <input name="description"
               class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-sm" />
      </label>
      <label class="block">
        <span class="text-xs text-slate-400">Priority</span>
        <select name="priority"
                class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-sm">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </label>
      <button class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-medium rounded px-4 py-1.5 text-sm">
        Create case
      </button>
    </div>
    <label class="block">
      <span class="text-xs text-slate-400">
        Brief (optional) &mdash; the case's tracking words are set up <span class="text-slate-300">automatically</span>
        from its name. Add a line of detail here and (with an AI model) it'll expand the words &amp; add starter questions.
      </span>
      <input name="brief" placeholder="e.g. Track Nightjar Group: new victims, wallets and infrastructure"
             class="mt-1 w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-sm" />
    </label>
  </form>

  {% include "_case_list.html" %}
</section>
{% endblock %}
