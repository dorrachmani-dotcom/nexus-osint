version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Tailwind v4 is a different toolchain (CSS-first config, new CLI); moving
      # to it is a deliberate migration, not a dependency bump.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # htmx 2 changes hx-on syntax and request defaults; upgrade deliberately.
      - dependency-name: htmx.org
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
